<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDC Engine v3 - Stress Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020202; color: #e0e0e0; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        .panel { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        input[type=range] { -webkit-appearance: none; background: #333; height: 4px; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
    </style>
</head>
<body class="flex flex-col h-screen">

<div class="panel absolute top-6 left-6 p-6 rounded-2xl z-10 w-80 shadow-2xl">
    <h1 class="text-2xl font-black tracking-tighter bg-gradient-to-br from-blue-400 to-cyan-300 bg-clip-text text-transparent mb-1">STRESS TEST V3</h1>
    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-6 font-bold">Analyse de Rupture de Stabilité</p>
    
    <div class="space-y-6">
        <div>
            <div class="flex justify-between mb-2">
                <label class="text-[10px] font-bold text-gray-400">AGITATION (CHAOS)</label>
                <span id="chaos-val" class="text-[10px] text-blue-400 font-mono">50%</span>
            </div>
            <input type="range" id="chaos" min="0" max="200" value="50" class="w-full">
        </div>
        
        <div>
            <div class="flex justify-between mb-2">
                <label class="text-[10px] font-bold text-gray-400">FORCE DE CONSENSUS</label>
                <span id="strength-val" class="text-[10px] text-cyan-400 font-mono">30%</span>
            </div>
            <input type="range" id="strength" min="0" max="100" value="30" class="w-full">
        </div>

        <button id="inject-energy" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-black rounded-lg transition-all uppercase tracking-widest">
            Injecter Perturbation Massive
        </button>
    </div>

    <div class="mt-8">
        <div class="flex justify-between text-[9px] font-bold text-gray-500 mb-2 tracking-widest">
            <span>ENTROPIE DU SYSTÈME</span>
            <span id="variance-percent">0%</span>
        </div>
        <div class="h-1 w-full bg-gray-900 rounded-full overflow-hidden">
            <div id="variance-bar" class="h-full bg-gradient-to-r from-blue-500 to-cyan-300 transition-all duration-100" style="width: 0%"></div>
        </div>
    </div>
</div>

<canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const chaosInput = document.getElementById('chaos');
    const strengthInput = document.getElementById('strength');
    const energyBtn = document.getElementById('inject-energy');
    const varianceBar = document.getElementById('variance-bar');
    const variancePercent = document.getElementById('variance-percent');

    let width, height, particles = [];
    const COUNT = 1200;

    class Entity {
        constructor() {
            this.x = Math.random() * window.innerWidth;
            this.y = Math.random() * window.innerHeight;
            this.vx = 0;
            this.vy = 0;
            this.history = [];
        }

        update(chaos, strength) {
            // 1. Agitation Brownienne (Chaos)
            this.vx += (Math.random() - 0.5) * (chaos * 0.1);
            this.vy += (Math.random() - 0.5) * (chaos * 0.1);

            // 2. Recherche de Consensus (Interaction avec 3 voisins aléatoires - Small World)
            for(let i=0; i<3; i++) {
                let target = particles[Math.floor(Math.random() * COUNT)];
                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist > 0) {
                    // Force de rappel vers le groupe
                    let pull = (dist - 100) * (strength * 0.0001);
                    this.vx += (dx/dist) * pull;
                    this.vy += (dy/dist) * pull;
                }
            }

            // 3. Application de l'inertie (Le Momentum de ton système)
            this.vx *= 0.92;
            this.vy *= 0.92;

            this.x += this.vx;
            this.y += this.vy;

            // Bords élastiques
            if (this.x < 0 || this.x > width) this.vx *= -1.5;
            if (this.y < 0 || this.y > height) this.vy *= -1.5;
        }

        draw() {
            const speed = Math.sqrt(this.vx**2 + this.vy**2);
            const alpha = Math.min(1, 0.1 + speed * 0.2);
            ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 1.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = Array.from({length: COUNT}, () => new Entity());
    }

    energyBtn.onclick = () => {
        particles.forEach(p => {
            p.vx += (Math.random() - 0.5) * 100;
            p.vy += (Math.random() - 0.5) * 100;
        });
    };

    function render() {
        ctx.fillStyle = 'rgba(2, 2, 2, 0.2)';
        ctx.fillRect(0, 0, width, height);

        const chaos = parseFloat(chaosInput.value);
        const strength = parseFloat(strengthInput.value);
        
        document.getElementById('chaos-val').innerText = chaos + " pts";
        document.getElementById('strength-val').innerText = strength + " pts";

        let energyTotal = 0;
        particles.forEach(p => {
            p.update(chaos, strength);
            p.draw();
            energyTotal += Math.abs(p.vx) + Math.abs(p.vy);
        });

        // Calcul de l'entropie
        let entropy = Math.min(100, (energyTotal / COUNT) * 5);
        varianceBar.style.width = entropy + "%";
        variancePercent.innerText = Math.round(entropy) + "%";

        requestAnimationFrame(render);
    }

    window.onresize = init;
    init();
    render();
</script>
</body>
</html>
