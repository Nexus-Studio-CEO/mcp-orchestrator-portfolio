<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UDC Mobile Stress Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }
        .card { background: #111; border: 1px solid #222; border-radius: 1rem; }
        .btn { transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <header class="mb-6">
        <h1 class="text-2xl font-black text-blue-500 italic">UDC ENGINE</h1>
        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Test de Performance sur Hardware Limité</p>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="card p-4">
            <div class="text-[9px] font-bold text-gray-500 uppercase mb-1">FPS Actuel</div>
            <div id="fps-counter" class="text-2xl font-mono text-white">0</div>
        </div>
        <div class="card p-4">
            <div class="text-[9px] font-bold text-gray-500 uppercase mb-1">Entités</div>
            <div id="entity-counter" class="text-2xl font-mono text-blue-400">0</div>
        </div>
    </div>

    <div class="card p-5 mb-6">
        <div class="flex justify-between items-center mb-4">
            <span id="mode-label" class="text-xs font-bold px-2 py-1 bg-gray-800 rounded text-gray-400 uppercase">Mode: En attente</span>
            <div id="load-bar-bg" class="w-24 h-1 bg-gray-800 rounded-full overflow-hidden">
                <div id="load-bar" class="h-full bg-blue-500" style="width: 0%"></div>
            </div>
        </div>
        
        <p id="description" class="text-[11px] text-gray-400 leading-relaxed mb-4">
            Appuyez sur un bouton pour comparer l'efficacité du calcul sur vos 4 cœurs.
        </p>

        <div class="grid grid-cols-1 gap-3">
            <button onclick="runTest('classic')" class="btn py-4 bg-red-900/20 border border-red-500/50 text-red-500 rounded-xl font-bold text-xs uppercase">
                Mode Classique (Lourd)
            </button>
            <button onclick="runTest('udc')" class="btn py-4 bg-blue-900/20 border border-blue-500/50 text-blue-500 rounded-xl font-bold text-xs uppercase">
                Mode UDC (Optimisé)
            </button>
        </div>
    </div>

    <div class="mt-auto card p-4 border-dashed border-blue-500/30">
        <h3 class="text-[10px] font-bold text-blue-400 uppercase mb-2 italic">Verdict de Puissance Virtuelle</h3>
        <div id="verdict" class="text-[11px] text-gray-500">
            Le test déterminera combien d'entités votre téléphone peut gérer avant de ramer.
        </div>
    </div>

    <canvas id="procCanvas" style="display:none"></canvas>

    <script>
        let mode = 'none';
        let count = 0;
        let running = false;
        let fps = 0;
        let lastTime = performance.now();
        let frames = 0;

        const fpsEl = document.getElementById('fps-counter');
        const countEl = document.getElementById('entity-counter');
        const modeLabel = document.getElementById('mode-label');
        const loadBar = document.getElementById('load-bar');
        const verdict = document.getElementById('verdict');
        const description = document.getElementById('description');

        function runTest(selectedMode) {
            mode = selectedMode;
            count = 100; // Départ
            running = true;
            modeLabel.innerText = "Mode: " + (mode === 'classic' ? 'CLASSIQUE' : 'UDC');
            modeLabel.className = mode === 'classic' ? 
                "text-xs font-bold px-2 py-1 bg-red-900 text-red-100 rounded uppercase" : 
                "text-xs font-bold px-2 py-1 bg-blue-900 text-blue-100 rounded uppercase";
            
            description.innerText = mode === 'classic' ? 
                "Calcul force brute : chaque entité vérifie toutes les autres. Très lourd pour un CPU 4 coeurs." : 
                "Calcul par Consensus : chaque entité ne vérifie que 5 voisins. Utilisation intelligente du hardware.";
            
            loop();
        }

        function loop() {
            if(!running) return;

            const now = performance.now();
            frames++;

            if (now > lastTime + 1000) {
                fps = Math.round((frames * 1000) / (now - lastTime));
                frames = 0;
                lastTime = now;
                
                fpsEl.innerText = fps;
                countEl.innerText = count;

                if (fps > 25) {
                    // Si c'est fluide, on augmente la charge
                    let step = mode === 'udc' ? 200 : 50;
                    count += step;
                    loadBar.style.width = (count / 5000 * 100) + "%";
                } else {
                    // Rupture
                    running = false;
                    const boost = mode === 'udc' ? "ÉLEVÉ" : "FAIBLE";
                    verdict.innerHTML = `<span class="text-white font-bold uppercase">Rupture à ${count} entités.</span><br>Votre téléphone saturait à cause de la limite CPU. En mode UDC, vous pourriez monter bien plus haut.`;
                    return;
                }
            }

            // SIMULATION DU TRAVAIL CPU
            if (mode === 'classic') {
                // Complexité Quadratique : O(n²)
                // On simule une boucle de calcul qui sature la RAM et le CPU
                let work = Math.min(count, 1500); // Protection pour ne pas figer le tel
                for(let i=0; i < work; i++) {
                    for(let j=0; j < work; j++) {
                        let a = Math.sqrt(i * j);
                    }
                }
            } else {
                // Complexité Linéaire : O(n) - Ton Système
                for(let i=0; i < count; i++) {
                    for(let k=0; k < 5; k++) { // Voisinage Small-World fixe
                        let a = Math.sqrt(i * k);
                    }
                }
            }

            if(running) requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
