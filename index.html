<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moteur de Stabilité Visuelle - UDC v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #e0e0e0; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; cursor: crosshair; }
        .panel { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex flex-col h-screen">

<div class="panel absolute top-4 left-4 p-5 rounded-xl border border-white/10 z-10 w-72 shadow-2xl">
    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mb-2">UDC Engine v2.0</h1>
    <p class="text-xs text-gray-400 mb-4 italic">Simulation de stabilité systémique en temps réel</p>
    
    <div class="space-y-4">
        <div>
            <label class="text-[10px] uppercase tracking-wider font-bold text-gray-500">Force de Couplage (Strength)</label>
            <input type="range" id="strength" min="0" max="100" value="15" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
        </div>
        <div>
            <label class="text-[10px] uppercase tracking-wider font-bold text-gray-500">Momentum (Inertie)</label>
            <input type="range" id="momentum" min="0" max="95" value="85" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
        </div>
        <div class="flex justify-between items-center bg-white/5 p-2 rounded">
            <span class="text-xs">Topologie Small-World</span>
            <div id="sw-indicator" class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]"></div>
        </div>
    </div>

    <div class="mt-6 pt-4 border-t border-white/5">
        <div class="text-[10px] text-gray-500 mb-1">VARIANCE DU SYSTÈME</div>
        <div class="h-1.5 w-full bg-gray-800 rounded-full overflow-hidden">
            <div id="variance-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 100%"></div>
        </div>
        <div id="status-text" class="text-[10px] mt-2 text-blue-400 font-mono">CALCUL DU CONSENSUS...</div>
    </div>
</div>

<canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const strengthInput = document.getElementById('strength');
    const momentumInput = document.getElementById('momentum');
    const varianceBar = document.getElementById('variance-bar');
    const statusText = document.getElementById('status-text');

    let width, height;
    let particles = [];
    const PARTICLE_COUNT = 1500;

    // --- CLASSE ENTITÉ (TON SYSTÈME) ---
    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            this.state = Math.random() * 2 * Math.PI; // Phase/État
            this.id = Math.random();
        }

        update(neighbors, globalStrength, momentumFactor) {
            let forceX = 0;
            let forceY = 0;

            // Logique de Consensus : les particules veulent s'aligner
            neighbors.forEach(other => {
                const dx = other.x - this.x;
                const dy = other.y - this.y;
                const distSq = dx * dx + dy * dy;
                
                if (distSq < 10000 && distSq > 0) {
                    const dist = Math.sqrt(distSq);
                    const pull = (dist - 50) * globalStrength * 0.001;
                    forceX += (dx / dist) * pull;
                    forceY += (dy / dist) * pull;
                }
            });

            // Application du Momentum (Inertie)
            this.vx = (this.vx * momentumFactor) + (forceX * (1 - momentumFactor));
            this.vy = (this.vy * momentumFactor) + (forceY * (1 - momentumFactor));

            this.x += this.vx;
            this.y += this.vy;

            // Collision bords
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
        }

        draw() {
            const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            const hue = 200 + speed * 20;
            ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.3 + speed})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.15)'; // Traînée pour voir le mouvement
        ctx.fillRect(0, 0, width, height);

        const strength = strengthInput.value / 100;
        const momentum = momentumInput.value / 100;

        // On simule par blocs (Topologie optimisée)
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            
            // Sélection des voisins (Simule le Small-World par échantillonnage)
            let neighbors = [];
            for (let j = 0; j < 5; j++) {
                neighbors.push(particles[Math.floor(Math.random() * particles.length)]);
            }

            p.update(neighbors, strength, momentum);
            p.draw();
        }

        // Calcul de la variance visuelle (Consensus)
        let totalSpeed = particles.reduce((sum, p) => sum + Math.abs(p.vx) + Math.abs(p.vy), 0);
        let variance = Math.min(100, (totalSpeed / PARTICLE_COUNT) * 20);
        varianceBar.style.width = `${variance}%`;
        
        if (variance < 5) {
            statusText.innerText = "ÉTAT DE STABILITÉ ATTEINT";
            statusText.style.color = "#4ade80";
        } else {
            statusText.innerText = "CALCUL DU CONSENSUS : " + Math.round(variance) + "% CHAOS";
            statusText.style.color = "#60a5fa";
        }

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);
    init();
    animate();

</script>
</body>
</html>
