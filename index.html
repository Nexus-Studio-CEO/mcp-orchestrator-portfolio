<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDC UI Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; overflow: hidden; color: white; }
        .ui-entity {
            position: absolute;
            transition: transform 0.1s linear;
            user-select: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-blue-400">Interface UDC (Émergence UI)</h1>
            <p class="text-gray-500">Cliquez pour ajouter une force. Les éléments s'auto-organisent.</p>
        </div>
        <!-- Les entités seront injectées ici -->
    </div>

    <script>
        const entities = [];
        const n = 15;

        // 1. Création des composants UI comme des entités UDC
        for (let i = 0; i < n; i++) {
            const el = document.createElement('div');
            el.className = 'ui-entity bg-slate-800 border border-blue-500/30 p-4 rounded-lg shadow-xl';
            el.innerHTML = `<h3 class="font-bold">Composant ${i}</h3><p class="text-xs text-gray-400">ID: ${Math.random().toString(36).substr(2, 5)}</p>`;
            document.body.appendChild(el);

            entities.push({
                el: el,
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: 0,
                vy: 0,
                w: 150,
                h: 80
            });
        }

        // 2. Moteur d'émergence (Boucle UDC)
        function update() {
            for (let i = 0; i < entities.length; i++) {
                let e1 = entities[i];

                // Force de répulsion (pour éviter les chevauchements)
                for (let j = i + 1; j < entities.length; j++) {
                    let e2 = entities[j];
                    let dx = e2.x - e1.x;
                    let dy = e2.y - e1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;

                    if (dist < 200) {
                        let force = (200 - dist) * 0.05;
                        let fx = (dx / dist) * force;
                        let fy = (dy / dist) * force;
                        e1.vx -= fx; e1.vy -= fy;
                        e2.vx += fx; e2.vy += fy;
                    }
                }

                // Force d'attraction vers le centre (pour garder l'UI groupée)
                let cx = window.innerWidth / 2 - e1.x;
                let cy = window.innerHeight / 2 - e1.y;
                e1.vx += cx * 0.01;
                e1.vy += cy * 0.01;

                // Application de la physique
                e1.x += e1.vx;
                e1.y += e1.vy;
                e1.vx *= 0.8; // Friction
                e1.vy *= 0.8;

                // Mise à jour visuelle
                e1.el.style.transform = `translate(${e1.x}px, ${e1.y}px)`;
            }
            requestAnimationFrame(update);
        }

        update();

        // Interaction : Ajout de force au clic
        window.addEventListener('mousedown', (e) => {
            entities.forEach(ent => {
                let dx = ent.x - e.clientX;
                let dy = ent.y - e.clientY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                ent.vx += (dx/dist) * 50;
                ent.vy += (dy/dist) * 50;
            });
        });
    </script>
</body>
</html>
