<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UDC Nano - Test de Survie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; }
        .border-neon { border: 1px solid #00ff00; box-shadow: 0 0 10px #00ff0033; }
        .bg-dark { background: rgba(0, 20, 0, 0.9); }
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="p-4 flex flex-col h-screen overflow-hidden">

    <div class="mb-4">
        <h1 class="text-xl font-bold tracking-tighter uppercase italic">UDC Nano v1.0</h1>
        <p class="text-[9px] opacity-70">HARDWARE : 4 CORES / 2GB RAM DETECTED</p>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-4">
        <div class="border-neon bg-dark p-3 rounded">
            <div class="text-[8px] uppercase">Ressources CPU</div>
            <div id="cpu-load" class="text-lg font-bold">--</div>
        </div>
        <div class="border-neon bg-dark p-3 rounded">
            <div class="text-[8px] uppercase">État Système</div>
            <div id="sys-status" class="text-[10px] text-yellow-500 font-bold">READY</div>
        </div>
    </div>

    <div class="flex-1 border-neon bg-dark p-4 rounded-lg flex flex-col">
        <div class="text-[10px] mb-2 border-b border-green-900 pb-1 italic">Console de Stabilisation</div>
        <div id="console" class="flex-1 text-[9px] overflow-y-auto font-mono text-green-700 leading-tight mb-4">
            > Initialisation du noyau UDC...<br>
            > En attente d'injection de données...
        </div>

        <div class="grid grid-cols-1 gap-2">
            <button onclick="startNano('classic')" class="bg-red-900/30 border border-red-500 text-red-500 text-[10px] py-3 rounded font-bold uppercase">
                Test Force Brute
            </button>
            <button onclick="startNano('udc')" class="bg-green-900/30 border border-green-500 text-green-500 text-[10px] py-3 rounded font-bold uppercase">
                Test Consensus UDC
            </button>
        </div>
    </div>

    <div class="mt-4 text-[8px] opacity-50 text-center uppercase tracking-widest">
        Optimisé pour architectures ARM Cortex v7/v8
    </div>

    <script>
        const consoleEl = document.getElementById('console');
        const sysStatus = document.getElementById('sys-status');
        const cpuLoad = document.getElementById('cpu-load');

        function log(msg, color = "#00ff00") {
            const div = document.createElement('div');
            div.style.color = color;
            div.innerHTML = `> ${msg}`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function startNano(mode) {
            consoleEl.innerHTML = "";
            sysStatus.innerText = "CALCUL...";
            sysStatus.className = "text-[10px] text-blue-500 font-bold";
            
            log(`DÉMARRAGE MODE: ${mode.toUpperCase()}`);
            log("Hardware bridé détecté. Allocation minimale...");

            const start = performance.now();
            let operations = 0;
            const limit = mode === 'classic' ? 500 : 5000;
            
            // On utilise setTimeout pour ne pas freezer l'UI du téléphone
            for (let i = 0; i < limit; i++) {
                if (i % 100 === 0) {
                    // Petite pause pour laisser le téléphone respirer (Asynchrone)
                    await new Promise(r => setTimeout(r, 0));
                    cpuLoad.innerText = Math.round((i/limit)*100) + "%";
                }

                if (mode === 'classic') {
                    // Simulation N² (Lourdeur exponentielle)
                    for (let j = 0; j < 50; j++) {
                        let x = Math.sin(i) * Math.cos(j);
                        operations++;
                    }
                } else {
                    // Simulation UDC (Linéaire optimisée)
                    let x = Math.sin(i) * Math.cos(5);
                    operations++;
                }
            }

            const end = performance.now();
            const time = (end - start).toFixed(2);
            
            sysStatus.innerText = "COMPLÉTÉ";
            sysStatus.className = "text-[10px] text-green-500 font-bold";
            
            log(`TERMINE EN ${time}ms`, "#fff");
            log(`OPÉRATIONS: ${operations}`);
            
            if (mode === 'udc') {
                log("ANALYSE: Consensus atteint sans saturation.", "#4ade80");
            } else {
                log("ANALYSE: Risque de surchauffe/freeze.", "#ef4444");
            }
        }
    </script>
</body>
</html>
